<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pago Exitoso - MC JHOSS</title>
  <meta name="description" content="Tu pago en MC JHOSS se realizó con éxito. Descarga tu pasaje electrónico.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="success-page">
  <div class="card success-card">
    <div class="success-icon">✓</div>
    <h1 style="color: var(--gray-900); margin-bottom: 0.5rem;">¡Pago Exitoso!</h1>
    <p style="color: var(--gray-500); margin-bottom: 1.5rem;">Tu reserva ha sido confirmada. Te enviaremos los detalles a tu correo.</p>

    <div style="text-align: left; background: var(--gray-100); padding: 1.5rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
      <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--gray-200);">
        <span style="color: var(--gray-600);">Código de reserva</span>
        <span style="font-weight: 800; color: var(--primary);">#MCJ-8921</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--gray-200);">
        <span style="color: var(--gray-600);">Ruta</span>
        <span style="font-weight: 700;">Lima → Trujillo</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--gray-200);">
        <span style="color: var(--gray-600);">Fecha</span>
        <span style="font-weight: 700;">15 Ago 2026</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--gray-200);">
        <span style="color: var(--gray-600);">Asiento</span>
        <span style="font-weight: 700;">05</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 0.5rem 0;">
        <span style="color: var(--gray-600);">Total pagado</span>
        <span style="font-weight: 800; color: var(--success);">S/ 53.10</span>
      </div>
    </div>

    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
      <a href="pasajero.html" class="btn btn-primary">Ir a mi dashboard</a>
      <a href="index.html" class="btn btn-secondary">Volver al inicio</a>
    </div>
  </div>
</body>
</html>
