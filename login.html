<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - MC JHOSS</title>
  <meta name="description" content="Inicia sesión como pasajero, conductor o administrador en MC JHOSS.">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo" style="justify-content: center;">
        <div class="logo-icon">MC</div>
        MC JHOSS
      </div>
      <p style="color: var(--gray-500);">Sistema de Pasajes Profesional</p>
    </div>

    <h2 class="text-center mb-2" style="color: var(--gray-900);">Iniciar Sesión</h2>
    <p class="text-center mb-3" style="color: var(--gray-500);">Selecciona tu rol para continuar</p>

    <form action="pasajero.html" method="get">
      <div class="role-selector">
        <div class="role-option">
          <input type="radio" name="rol" id="rol-pasajero" value="pasajero" checked>
          <label for="rol-pasajero" class="role-label">
            <span>👤</span>
            Pasajero
          </label>
        </div>
        <div class="role-option">
          <input type="radio" name="rol" id="rol-conductor" value="conductor">
          <label for="rol-conductor" class="role-label">
            <span>🚌</span>
            Conductor
          </label>
        </div>
        <div class="role-option">
          <input type="radio" name="rol" id="rol-admin" value="administrador">
          <label for="rol-admin" class="role-label">
            <span>⚙️</span>
            Admin
          </label>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Correo electrónico</label>
        <input type="email" id="email" class="form-control" placeholder="tu@correo.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <div class="form-group" style="display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; color: var(--gray-600); cursor: pointer;">
          <input type="checkbox" checked> Recordarme
        </label>
        <a href="#" style="color: var(--primary); font-weight: 600;">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn btn-primary btn-block mb-2">Ingresar al Sistema</button>

      <p class="text-center" style="color: var(--gray-500); font-size: 0.875rem;">
        ¿No tienes cuenta? <a href="#" style="color: var(--primary); font-weight: 700;">Regístrate aquí</a>
      </p>
    </form>

    <div class="mt-3" style="text-align: center; font-size: 0.875rem; color: var(--gray-400);">
      <p><strong>Demo rápida:</strong></p>
      <a href="pasajero.html" class="btn btn-sm btn-secondary" style="margin: 0.25rem;">Dashboard Pasajero</a>
      <a href="conductor.html" class="btn btn-sm btn-secondary" style="margin: 0.25rem;">Dashboard Conductor</a>
      <a href="administrador.html" class="btn btn-sm btn-secondary" style="margin: 0.25rem;">Dashboard Admin</a>
    </div>
  </div>
</body>
</html>
